[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-sensors"
version = "1.0.0"
description = "Readers and converters for RAPID and BDS fish-passage sensor binaries"
readme = "README.md"
authors = [{ name = "Jeffrey A. Tuhtan", email = "jeffrey.tuhtan@taltech.ee" }]
license = { text = "CC-BY-NC-4.0" }
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: Free for non-commercial use",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jtuhtan/RAPID"

[project.scripts]
rapid-convert = "rapid_sensors.cli:main"

[tool.setuptools]
packages = ["rapid_sensors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
